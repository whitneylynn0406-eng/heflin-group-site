function fromB64(s) {
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function unlock(password) {
  var all = fromB64(BLOB);
  var salt = all.slice(0, 16), iv = all.slice(16, 28), data = all.slice(28);
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data); // throws if the password is wrong
  return new TextDecoder().decode(plain);
}

document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var msg = document.getElementById("msg"), btn = document.getElementById("go");
  msg.textContent = "";
  if (!window.crypto || !crypto.subtle) { msg.textContent = "This browser can't open the preview. Try a current browser over https."; return; }
  btn.disabled = true;
  var html;
  try { html = await unlock(document.getElementById("pw").value.trim()); }
  catch (err) { msg.textContent = "That code didn't work."; btn.disabled = false; return; }
  document.open(); document.write(html); document.close();
});
